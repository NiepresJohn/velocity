services:
  postgres:
    image: postgres:16
    container_name: velocity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity
      POSTGRES_DB: velocity
    ports:
      - "5432:5432"
    volumes:
      - velocity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  velocity_pg_data:
