name: ci
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://velocity:velocity@localhost:5432/velocity
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: velocity, POSTGRES_PASSWORD: velocity, POSTGRES_DB: velocity }
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: NODE_ENV=production pnpm build
