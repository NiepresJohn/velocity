# Production stack: app + postgres + caddy (automatic HTTPS).
# Usage: cp .env.production.example .env.production, edit, then
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Migrations are an explicit release step: see docs/DEPLOYMENT.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://velocity:${POSTGRES_PASSWORD}@postgres:5432/velocity
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["3000"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: velocity
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity"]
      interval: 10s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  pg_data:
  caddy_data:
  caddy_config:
